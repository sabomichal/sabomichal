name: Update Space Shooter Game

on:
  schedule:
    # Denne o 03:17 UTC (mimo špičky, aby sa cron menej odkladal)
    - cron: '17 3 * * *'
  workflow_dispatch: # manuálne spustenie zo záložky Actions

# Zabráni súbežným behom (napr. cron + ručné spustenie naraz), ktoré si
# navzájom odmietajú push. Nový beh zruší ten prebiehajúci.
concurrency:
  group: update-space-shooter
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2 # nutné pre amend predchádzajúceho commitu

      - uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: 'game.gif'
          strategy: 'random'
